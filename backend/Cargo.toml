[package]
name = "frank-backend"
version = "0.1.0"
edition = "2021"
description = "Uncle Frank's ML Lab — cursed graph runtime"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ufp-syntax = { path = "../crates/ufp-syntax" }
ufp-types = { path = "../crates/ufp-types" }
ufp-runtime = { path = "../crates/ufp-runtime" }
